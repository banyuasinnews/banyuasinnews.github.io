<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publikasi Berita • Banyuasin News</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head><body>
<header><div class="wrap"><b>BN BANYUASIN NEWS</b><span> • Panel Publikasi</span></div></header>
<main class="card">
<h1>Publikasikan Berita</h1>
<p class="note">Setiap publikasi membuat data berita di Supabase dan menghasilkan <b>HTML artikel statis</b> yang dapat dibaca crawler/validator tanpa bergantung pada JavaScript.</p>
<form id="articleForm">
<label>Judul berita<input id="title" name="title" required></label>
<label>Slug URL<input id="slug" name="slug" required></label>
<label>Kategori<select name="category"><option>BANYUASIN</option><option>POLISI</option><option>HUKUM</option><option>PEMERINTAHAN</option><option>SUMSEL</option><option>NASIONAL</option></select></label>
<label>Penulis<input name="author" value="Redaksi"></label>
<label>Tanggal & waktu terbit<input name="published_at" type="datetime-local" required></label>
<label>Foto utama<input id="image" type="file" accept="image/*"></label>
<label>Ringkasan<textarea name="excerpt" required></textarea></label>
<label>Isi berita<textarea name="content" required></textarea></label>
<label>Status<select name="status"><option value="published">Terbitkan</option><option value="draft">Draft</option></select></label>
<button type="submit">Simpan & Buat Artikel Statis</button>
</form>
<div id="msg"></div><div id="preview"></div>
</main>
<script src="admin-static.js"></script>
</body></html>
