<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Banyuasin News</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="header"><div class="container header-in"><a class="brand" href="index.html"><span class="logo">BN</span><span><strong>BANYUASIN<span>NEWS</span></strong><small>Panel Redaksi</small></span></a><div><a class="back" href="index.html">Website</a><button class="search-btn" id="logoutBtn" style="display:none">Keluar</button></div></div></header>
<main class="container admin-wrap">
<section id="loginBox" class="admin-card"><h1>Login Redaksi</h1><p>Gunakan akun yang dibuat di Supabase Authentication.</p><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button class="primary" id="loginBtn">Masuk</button><p id="loginMsg" class="msg"></p></section>
<section id="dashboard" style="display:none">
<div class="admin-head"><div><span class="tag">PANEL REDAKSI</span><h1>Kelola Berita</h1></div><button class="primary" id="newBtn">+ Berita Baru</button></div>
<div class="admin-grid"><section class="admin-card" id="editor"><h2>Editor Berita</h2>
<label>Judul<input id="title" placeholder="Judul berita"></label>
<label>Slug<input id="slug" placeholder="otomatis dari judul"></label>
<label>Kategori<select id="category"><option>BANYUASIN</option><option>POLISI</option><option>HUKUM</option><option>PEMERINTAHAN</option><option>SUMSEL</option><option>NASIONAL</option><option>PENDIDIKAN</option><option>EKONOMI</option><option>OLAHRAGA</option></select></label>
<label>Penulis<input id="author" value="Redaksi"></label>
<label>Foto<input id="image" type="file" accept="image/*"></label>
<label>Ringkasan<textarea id="excerpt" rows="3"></textarea></label>
<label>Isi Berita<textarea id="content" rows="14"></textarea></label>
<div class="editor-actions"><select id="status"><option value="published">Terbitkan</option><option value="draft">Simpan Draft</option></select><button class="primary" id="saveBtn">Simpan Berita</button></div>
<p id="saveMsg" class="msg"></p></section>
<aside class="admin-card"><h2>Berita Tersimpan</h2><div id="articleList">Memuat...</div></aside></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script>
</body></html>
